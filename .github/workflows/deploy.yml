name: Production Deployment

# Fires on every commit that lands on main — which includes every PR merge,
# regardless of whether it was a merge commit, a squash, or a rebase.
#
# This is deliberately NOT `pull_request: types: [closed]`. That event only
# covers merges that went through a PR, so a hotfix pushed straight to main
# would silently never deploy. `push` covers both, and needs no
# `if: merged == true` guard because a PR closed without merging produces no
# push at all.
on:
  push:
    branches:
      - main
  # Lets you re-run migrations + deploy by hand from the Actions tab.
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# Never let two production deploys (or two migration runs) overlap.
# cancel-in-progress stays false: cancelling a job midway through `db push`
# would leave the migration history in an unknown state.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gates the deploy. Note that `vercel build` runs `next build`, which
  # type-checks the app graph on its own — so this job's value is the two
  # things that build does NOT do: run the unit tests, and lint.
  #
  # Next 16 removed ESLint from `next build` entirely, and its TypeScript pass
  # only covers files reachable from the app. `npm test` and `npm run lint`
  # are the only things checking the rest.
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Stricter than the build: tsconfig.json includes **/*.ts, so this covers
      # the test files too, which `next build` never looks at.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  # Applies supabase/migrations/*.sql to the remote project BEFORE the new code
  # goes live, so the deployed app never queries a schema that doesn't exist yet.
  #
  # Requires one secret on the "production" environment
  # (Settings > Environments > production > Environment secrets):
  #
  #   SUPABASE_DB_URL - the session pooler connection string, copied verbatim from
  #                     Dashboard > Connect > Session pooler. Shaped like
  #                     postgresql://postgres.<ref>:<pw>@<host>.pooler.supabase.com:5432/postgres
  #                     Special characters in the password must be percent-encoded
  #                     (@ -> %40, / -> %2F); the CLI requires it.
  #
  # Deliberately NOT `supabase link` + `--linked`. Linking calls the Management
  # API, and one of those calls is GET /v1/projects/<ref>/api-keys?reveal=true,
  # which needs organization-level privileges. An account that can read the
  # project but holds no org role gets a 403 there, surfaced as the thoroughly
  # misleading "Authorization failed for the access token and project ref pair".
  # Talking to Postgres directly skips the Management API entirely: no access
  # token, no project ref, no org role, one fewer credential to rotate.
  #
  # Use the SESSION pooler (port 5432), never the transaction pooler (6543):
  # transaction mode does not hold a session across statements, which migrations
  # need. The pooler is also IPv4, which matters because GitHub runners are
  # IPv4-only and the direct db.<ref>.supabase.co host is IPv6-only.
  migrate:
    name: Migrate Supabase Postgres
    needs: verify
    runs-on: ubuntu-latest
    # Attach repo Settings > Environments > production for approval gates.
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `latest`: the CLI is the thing applying DDL to
      # production, and an unattended minor bump is not something you want to
      # discover mid-migration. Bump this deliberately.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Fails in two seconds with a readable message rather than a connection
      # timeout a minute in. Never echoes the secret.
      - name: Validate Supabase secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set on the 'production' environment."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::SUPABASE_DB_URL must be a postgresql:// connection string, copied from Dashboard > Connect > Session pooler."
               exit 1 ;;
          esac
          # Transaction mode breaks migrations in ways that only surface midway
          # through a push, so reject it up front rather than half-applying DDL.
          case "$SUPABASE_DB_URL" in
            *:6543/*)
              echo "::error::SUPABASE_DB_URL points at the transaction pooler (port 6543). Migrations need the session pooler on port 5432."
              exit 1 ;;
          esac
          echo "SUPABASE_DB_URL is present and well-formed."

      # Prints local-vs-remote migration history before touching anything, so a
      # failed run leaves behind a log saying which versions were out of sync.
      # Doubles as the credential check: a password rotated in the dashboard
      # without updating the secret fails here, with the CLI's own error,
      # instead of halfway through the push.
      - name: Show migration status
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      # Idempotent: the CLI reads supabase_migrations.schema_migrations and applies
      # only the versions that aren't recorded yet, so re-running a deploy is safe.
      #
      # --include-seed is deliberately absent, and must stay absent. supabase/seed.sql
      # creates a hardcoded admin (admin@chatbot.local / admin123456) for local dev;
      # applying it to production would install a known-password admin account on a
      # live database. Same reason `supabase db reset` must never appear in this
      # workflow — it drops the database before re-seeding.
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

  # No app env vars here on purpose: `vercel pull` downloads the project's own
  # production environment variables, and the running app reads them from Vercel
  # at request time. Set NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
  # SUPABASE_SERVICE_ROLE_KEY, OPENAI_API_KEY, UPSTASH_REDIS_REST_URL,
  # UPSTASH_REDIS_REST_TOKEN, NEXT_PUBLIC_APP_URL and CRON_SECRET in the Vercel
  # dashboard (Production scope), not here.
  #
  # `needs: migrate` is what keeps the ordering safe: a failed migration blocks
  # the deploy, so the old code keeps serving rather than new code hitting an old
  # schema.
  deploy:
    name: Deploy to Vercel
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
